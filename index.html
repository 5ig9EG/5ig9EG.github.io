<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моё портфолио</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      line-height: 1.7;
      color: #253047;
      background: #f0f4fa;
    }

    main {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      padding: 35px;
      color: white;
      background: #243b67;
      border-radius: 20px;
    }

    h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); }
    h2 { margin-top: 0; color: #243b67; }

    section {
      margin-top: 20px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #243b670a;
    }

    a { color: #245bc2; }
    a:hover { text-decoration: none; }
    footer { padding-top: 25px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Глеб Ефремов</h1>
      <p>Студент первого курса</p>
    </header>

    <section>
      <h2>Обо мне</h2>
      <p>
        Я учусь в университете "Высшая школа экономики".
        Интересуюсь шахматами.
      </p>
    </section>
    <section>
      <h2>Навыки</h2>
      <ul>
        <li>Владею английским языком на уровне B1.</li>
      </ul>
    </section>
    
    <section>
      <h2>Контакты</h2>
      <p>
        Мои проекты:
        <a href="https://github.com/5ig9EG">профиль GitHub</a>
      </p>
    </section>
